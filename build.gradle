plugins {
    id 'java'
    id 'maven-publish'
}

java {
    disableAutoTargetJvm()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    // Additional test dependencies
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.threeten:threeten-extra:1.10.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.20'
    // A real Jersey client for the end-to-end feature test (the library itself only needs the API)
    testImplementation 'org.glassfish.jersey.core:jersey-client:3.1.12'
    testImplementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.12'

    // Other dependencies
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.12'
    implementation 'io.vertx:vertx-auth-oauth2:5.2.0'
    implementation 'software.amazon.awssdk:dynamodb-enhanced:2.55.7'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.alltheducks'
            artifactId = 'oauth2-jersey-client-filter'
            version = version

            from components.java

        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/AllTheDucks/oauth2-jersey-client-filter")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.token") ?: System.getenv("TOKEN")
            }
        }
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}